name: Deploy Portfolio and App

on:
  push:
    branches: [ main ]

# Даем права на запись в GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Токен создается гитхабом автоматически

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/jemzee04/portfolio-devops-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: 194.226.120.134
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: GH_TOKEN,GH_ACTOR # Передаем переменные внутрь SSH-сессии
          script: |
            cd ~/my-project
            git pull origin main
            
            # Авторизуем Docker на сервере в реестре GitHub
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            
            # Теперь пулл пройдет без ошибок авторизации
            docker compose pull frontend
            docker compose up -d --build --remove-orphans
            
            # На всякий случай разлогиниваемся
            docker logout ghcr.io