events {
    worker_connections 1024;
}

http {
    # Редирект с HTTP (80) на HTTPS (443)
    server {
        listen 80;
        server_name danila-devops.ru www.danila-devops.ru;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            # Добавим для надежности, чтобы Nginx не пытался делать редирект внутри
            try_files $uri =404;
        }

        return 301 https://$host$request_uri;
    }

    # Основной HTTPS шлюз
    server {
        listen 443 ssl;
        server_name danila-devops.ru www.danila-devops.ru;

        # Пути к сертификатам (теперь они будут лежать здесь)
        ssl_certificate /etc/letsencrypt/live/danila-devops.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/danila-devops.ru/privkey.pem;

        # Базовая защита
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /results {
            proxy_pass http://app:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /monitoring/ {
            proxy_pass http://glances:61208/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}