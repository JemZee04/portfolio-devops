events {
    worker_connections 1024;
}

http {
    # WebSocket: заголовок Connection зависит от того, пришёл ли Upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Реле для телефонного клиента agent8s: ограничиваем частоту запросов с одного адреса.
    limit_req_zone $binary_remote_addr zone=agent8s:1m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=agent8s_conn:1m;

    # Редирект с HTTP (80) на HTTPS (443)
    server {
        listen 80;
        server_name danila-devops.ru www.danila-devops.ru;

        # Проверка Let's Encrypt (HTTP-01). Директива `return` на уровне server
        # выполняется ДО выбора location и перехватывала бы и этот путь, из-за чего
        # сертификат не продлевался. Поэтому редирект живёт в собственном location.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Основной HTTPS шлюз
    server {
        listen 443 ssl;
        server_name danila-devops.ru www.danila-devops.ru;

        # Пути к сертификатам (теперь они будут лежать здесь)
        ssl_certificate /etc/letsencrypt/live/danila-devops.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/danila-devops.ru/privkey.pem;

        # Базовая защита
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # agent8s: реле между телефоном и компьютером (отдельный контейнер agent8s-relay,
        # код — в репозитории agent8s). Трафик внутри WebSocket зашифрован end-to-end,
        # реле его не читает. Имя контейнера разрешается динамически: если реле остановлено,
        # недоступен только этот префикс, а сайт и сам nginx продолжают работать.
        location = /agent8s {
            return 308 /agent8s/;
        }

        location ^~ /agent8s/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $agent8s_relay http://agent8s-relay:8765;
            proxy_pass $agent8s_relay;

            limit_req zone=agent8s burst=60 nodelay;
            limit_conn agent8s_conn 40;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 64k;
        }

        # Сайт-портфолио
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
