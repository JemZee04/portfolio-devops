events {
    worker_connections 1024;
}

http {
    # Редирект с HTTP (80) на HTTPS (443)
    server {
        listen 80;
        server_name danila-devops.ru www.danila-devops.ru;

        # Проверка Let's Encrypt (HTTP-01). Директива `return` на уровне server
        # выполняется ДО выбора location и перехватывала бы и этот путь, из-за чего
        # сертификат не продлевался. Поэтому редирект живёт в собственном location.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Основной HTTPS шлюз
    server {
        listen 443 ssl;
        server_name danila-devops.ru www.danila-devops.ru;

        # Пути к сертификатам (теперь они будут лежать здесь)
        ssl_certificate /etc/letsencrypt/live/danila-devops.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/danila-devops.ru/privkey.pem;

        # Базовая защита
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Сайт-портфолио
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
